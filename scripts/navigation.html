<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>诸子学术通史 · 研究资料库</title>
<style>
:root{--ink:#203b39;--muted:#647573;--paper:#f5f3ed;--line:#dce1d8;--accent:#a87135}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei",sans-serif}header{background:var(--ink);color:#fff;padding:30px max(5vw,24px)}.eyebrow{font-size:12px;letter-spacing:3px;color:#d6c8a7}h1{font-family:SimSun,serif;font-size:32px;font-weight:500;margin:12px 0}header p{color:#d9e2dd;max-width:900px;line-height:1.8;font-size:14px}.stats{display:flex;flex-wrap:wrap;gap:25px;margin-top:24px}.stats strong{font-size:23px;font-weight:500;margin-right:6px}.stats span{font-size:12px;color:#cbd5cd}main{max-width:1500px;margin:auto;padding:25px}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}input,select,button{font:inherit;border:1px solid #cbd4ca;border-radius:6px;background:white;color:var(--ink);padding:10px 13px}input{min-width:220px;flex:1}button{cursor:pointer}button.active{background:var(--ink);color:white}.notice{border-left:3px solid var(--accent);background:#eee9dd;padding:12px 16px;font-size:13px;line-height:1.8;margin:15px 0}.layout{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1fr);gap:22px}.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}.panel h2{font-size:18px;font-weight:500;margin:0 0 15px}.list{max-height:72vh;overflow:auto}.card{border-bottom:1px solid var(--line);padding:14px 2px;cursor:pointer;line-height:1.8;font-size:14px}.card:hover{background:#f6f8f2}.tag{font-size:11px;background:#eaf0e8;color:#4b6255;padding:3px 7px;border-radius:3px;display:inline-block;margin-right:7px}.machine{background:#f5e8d7;color:#855d2b}.meta{font-size:12px;color:var(--muted)}#detail{line-height:1.95;max-height:82vh;overflow:auto}#detail h3{font-size:19px;font-weight:500}.text{white-space:pre-wrap;overflow-wrap:anywhere;font-family:SimSun,serif;font-size:16px}.small{font-size:13px;color:var(--muted)}a{color:#7c532b}img{max-width:100%;height:auto;border:1px solid var(--line);margin-top:15px}svg{width:100%;height:350px;background:#f8f9f4;border-radius:6px}footer{padding:15px 25px 35px;color:var(--muted);font-size:12px}#count{margin:12px 0}.legend{display:flex;gap:20px;font-size:12px;color:var(--muted);margin-bottom:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}.list{max-height:45vh}header{padding:25px}.stats{gap:12px}h1{font-size:26px}}
</style>
<header><div class="eyebrow">ZHUZI · DOCUMENTS & HISTORY</div><h1>诸子学术通史研究资料库</h1><p>以《庄子学史》的摘要性研究案例为样本，连接研究方法、人物著述、学术论断与证据。每条关系都回到一项有出处的判断。</p><div class="stats" id="stats"></div></header>
<main><div class="bar" id="tabs"></div><div class="bar"><input id="query" placeholder="检索严复、校勘、成书、管见……（多个词用空格分隔）" aria-label="检索资料"><select id="volume" aria-label="筛选来源"><option value="">全部册次</option></select><select id="review" aria-label="筛选核验状态"><option value="">全部记录</option><option value="checked">仅源段已核论断</option></select></div>
<div class="notice">“源段已核”表示已核对现代著作中的相应论述，古籍原典尚未独立回查。公开示例仅提供页码定位，不附原书、OCR 或扫描。接入自有资料后，仍须分别统计识别覆盖与学术核验覆盖。</div>
<div id="count" class="small"></div><div class="layout"><section class="panel"><h2 id="list-title">学术论断</h2><div class="list" id="list"></div></section><section class="panel" id="detail"><h2>从证据进入研究</h2><p>选择左侧记录查看出处、判断性质及相关关系。人物著述图中的连线表达论断中的关系，不能直接视为无争议史实。</p></section></div></main>
<footer>离线资料包 · 本地检索与可追溯研究 · 不连接外部账户，不上传文件</footer>
<script id="library-data" type="application/json">__DATA__</script>
<script>
const D=JSON.parse(document.getElementById('library-data').textContent), $=s=>document.getElementById(s);
let mode='claims';const labels={claims:'学术论断',entities:'人物与著述',disputes:'争议案',methods:'研究方法',pages:'证据页定位'};
const byId=Object.fromEntries(D.pages.map(p=>[p.id,p])),ent=Object.fromEntries(D.entities.map(e=>[e.id,e]));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const checked=x=>['source_passage_checked','primary_checked'].includes(x.review_status);
const stateNames={source_passage_checked:'源段已核',primary_checked:'原典已核',machine:'机器线索',text_checked:'已读待对影',curated_label:'已编目名称',unresolved_machine:'待辨识名称',person:'人物',work:'著述',title_label:'自动书题',edition:'版本',modern_source:'现代著作',problem:'研究问题',text_layer:'文本层次',place:'地区',section:'章节',method_topic:'方法主题',period_topic:'时代专题',evidence_group:'材料组'};
Object.assign(stateNames,{not_checked:'尚未独立回查',header_detected:'机器识别，待对影',image_checked:'已对影核定',unmapped:'尚未核定',legacy_ocr:'原文件文字层',none:'未检出文字',source_hypothesis:'作者提出的可能',reported_hypothesis:'书中转述的假说',source_inference:'作者推断',source_evaluation:'作者评价',source_assertion:'作者陈述',reported_position:'书中转述的主张',source_judgment:'作者判断',source_argument:'作者论证',source_quantified_estimate:'作者数量估计',source_historical_explanation:'作者历史解释',reported_bibliographic_description:'转述文献著录',source_comparison:'作者比较',source_interpretation:'作者解释',source_chronological_inference:'作者年代推断',reported_chronological_evidence:'转述纪年材料',source_sourcecriticism:'作者史料辨析',edition_structure:'版本目录结构',toc_attribution:'目录中的归属',reported_interpretation:'转述他人解释',cross_edition_overlap:'新旧版本对应',source_reconstruction:'作者历史重建',source_textual_argument:'作者文本考证',source_method_analysis:'作者方法分析',source_bibliographic_argument:'作者文献考辨',source_bibliographic_analysis:'作者文献分析',reported_chronological_hypothesis:'转述年代假说',source_case_induction:'由本书案例归纳',project_adaptation:'面向诸子研究扩展',institution_topic:'学术组织'});
const show=s=>stateNames[s]||s;
const norm=s=>String(s??'').replace(/莊/g,'庄').replace(/學/g,'学').replace(/嚴/g,'严').replace(/[複復]/g,'复').toLowerCase();
const terms=q=>norm(q).trim().split(/\s+/).filter(Boolean);
function sourcePages(r){if(mode==='pages')return [r];if(mode==='claims')return D.evidence.filter(e=>e.claim_id===r.id).map(e=>byId[e.page_id]);if(mode==='entities')return D.mentions.filter(m=>m.entity_id===r.id).map(m=>byId[m.page_id]);const ids=JSON.parse(r.claim_ids||r.case_claim_ids||'[]');return D.evidence.filter(e=>ids.includes(e.claim_id)).map(e=>byId[e.page_id])}
function filtered(){const ts=terms($('query').value),vol=$('volume').value,review=$('review').value;return D[mode].filter(r=>r.review_status!=='rejected'&&ts.every(t=>norm(JSON.stringify(r)).includes(t))&&(!vol||sourcePages(r).some(p=>p.source_id===vol))&&(!review||(mode==='claims'&&checked(r))))}
function short(r){return r.summary||r.label||r.question||r.title||`${r.id} · ${r.text.slice(0,75)}`}
function render(){const all=filtered();$('count').textContent=`共 ${all.length} 条匹配，显示前 100 条。${mode==='entities'?'人物与明确著述优先显示；自动书题仍待辨识。':''}`;$('list-title').textContent=labels[mode];$('list').innerHTML='';for(const r of all.slice(0,100)){const card=document.createElement('div');card.className='card';const state=r.review_status||(r.resolution_status==='unresolved_machine'?'machine':mode==='entities'?'名称已编目':'研究记录');card.innerHTML=`<span class="tag ${state==='machine'?'machine':''}">${esc(stateNames[state]||state)}</span><span class="meta">${esc(r.id)}</span><div>${esc(short(r))}</div>`;card.onclick=()=>detail(r);$('list').append(card)}}
function pageHtml(p){const s=D.sources.find(s=>s.id===p.source_id),im=D.images[p.id];return `<h3>${esc(p.id)} · 原书印页 ${esc(p.printed_page||'未核定')}</h3><p class="small">${esc(s.filename)}<br>PDF 页序 ${p.pdf_page}；页码状态 ${esc(show(p.page_map_status))}；文本来源 ${esc(show(p.text_origin))}。页文未经全文校订。</p>${s.uri?`<p><a href="${esc(s.uri+'#page='+p.pdf_page)}" target="_blank">打开自有 PDF 对应页</a></p>`:'<p class="small">本公开示例不附原书，请自行回查所列文献。</p>'}${im?`<details><summary>查看已保存的证据页图</summary><img src="${esc(im)}" alt="${esc(p.id)}证据页图"></details>`:''}<details><summary>展开原始 OCR 页文</summary><div class="text">${esc(p.text||'本页没有识别到文字，请回查原影。')}</div></details>`}
function detail(r){let out='';if(mode==='pages')out=pageHtml(r);else if(mode==='claims'){out=`<span class="tag">${esc(show(r.review_status))}</span><h3>${esc(r.summary)}</h3><p>提出者：${esc(r.proposer)}<br>判断性质：${esc(show(r.modality))}<br>原典核验：${esc(show(r.primary_status))}</p><p class="notice">${esc(r.limitations)}</p>`;for(const e of D.evidence.filter(e=>e.claim_id===r.id)){out+=`<hr><p class="small">核验范围：${esc(e.scope)}。${esc(e.review_note)}</p>`+pageHtml(byId[e.page_id]);}out+='<h3>相关关系</h3>'+D.relations.filter(e=>e.claim_id===r.id).map(e=>`<p>${esc(ent[e.subject_id].label)} → ${esc(e.predicate)} → ${esc(ent[e.object_id].label)}</p>`).join('');}else if(mode==='entities'){const rs=D.relations.filter(e=>(e.subject_id===r.id||e.object_id===r.id)&&D.claims.some(c=>c.id===e.claim_id&&c.review_status!=='rejected'));out=`<h3>${esc(r.label)}</h3><p class="small">${esc(show(r.type))} · ${esc(show(r.resolution_status))}</p>${r.type==='title_label'?'<p class="notice">此为自动提取的书题形式，同名异书、作者及版本尚未辨识。</p>':''}<div id="graph"></div>`;out+=rs.map(e=>`<p>${esc(ent[e.subject_id].label)} → ${esc(e.predicate)} → ${esc(ent[e.object_id].label)}<br><button data-claim="${esc(e.claim_id)}">查看 ${esc(e.claim_id)} 及其证据</button></p>`).join('');out+='<p class="small">共见页面：'+D.mentions.filter(m=>m.entity_id===r.id).length+'（机器匹配，可能受 OCR 与异名影响）</p>';}else if(mode==='disputes'){out=`<h3>${esc(r.question)}</h3><p>${esc(r.positions)}</p><h3>下一步证据</h3><p>${esc(r.next_evidence)}</p>`+JSON.parse(r.claim_ids).map(id=>`<button data-claim="${esc(id)}">${esc(id)}</button> `).join('');}else out=`<h3>${esc(r.id+' '+r.title)}</h3><p>${esc(r.content)}</p><p class="small">来源类型：${esc(show(r.origin))}</p>`+JSON.parse(r.case_claim_ids).map(id=>`<button data-claim="${esc(id)}">案例 ${esc(id)}</button> `).join('');$('detail').innerHTML=out;document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{mode='claims';syncTabs();detail(D.claims.find(c=>c.id===b.dataset.claim));render()});if(mode==='entities')graph(r)}
function graph(r){const rs=D.relations.filter(e=>(e.subject_id===r.id||e.object_id===r.id)&&D.claims.some(c=>c.id===e.claim_id&&c.review_status!=='rejected')).slice(0,8),ids=[...new Set(rs.flatMap(e=>[e.subject_id,e.object_id]))].filter(id=>id!==r.id);if(!ids.length)return;const pos={[r.id]:[250,175]};ids.forEach((id,i)=>{const a=i/ids.length*Math.PI*2;pos[id]=[250+180*Math.cos(a),175+125*Math.sin(a)]});let svg='<svg viewBox="0 0 500 350" role="img" aria-label="人物著述关系，每条关系可在下方查看证据">';for(const e of rs){const a=pos[e.subject_id],b=pos[e.object_id];svg+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#b9c6b9"/>`;}for(const [id,p]of Object.entries(pos))svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="${id===r.id?27:17}" fill="${id===r.id?'#254a43':'#c6d4bb'}"/><text x="${p[0]}" y="${p[1]+37}" text-anchor="middle" font-size="11" fill="#294b43">${esc(ent[id].label.slice(0,17))}</text>`;svg+='</svg>';$('graph').innerHTML=svg}
function syncTabs(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===mode))}
for(const [key,label]of Object.entries(labels)){const b=document.createElement('button');b.dataset.tab=key;b.textContent=label;b.onclick=()=>{mode=key;syncTabs();render();$('detail').innerHTML='<h2>'+esc(label)+'</h2><p>选择左侧记录查看具体内容与出处。</p>'};$('tabs').append(b)}
for(const s of D.sources){const o=document.createElement('option');o.value=s.id;o.textContent=s.id;$('volume').append(o)}
$('stats').innerHTML=[['已登记页',D.stats.pages],['核心论断',D.stats.claims],['争议案',D.stats.disputes],['方法卡',D.stats.methods]].map(([l,n])=>`<div><strong>${n}</strong><span>${l}</span></div>`).join('');$('query').oninput=render;$('volume').onchange=render;$('review').onchange=render;syncTabs();render();
</script></html>
